[package]
name = "fusefat"
version = "0.1.0"
edition = "2021"
authors = ["Developer"]
description = "A FUSE implementation for FAT filesystems written in Rust."
license = "MIT"

[dependencies]
easy_fuser = { version = "0.4.5", features = ["serial"] }
fatfs = { version = "0.3", features = ["chrono"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", default-features = true }
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
time = "0.3"
libc = "0.2"
fuser = "0.16"

[dev-dependencies]
tempfile = "3.10"
